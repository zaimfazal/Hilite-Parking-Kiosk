# HiLITE Mall Smart Parking — runtime configuration.
# Every hilite.* value can be overridden by an environment variable using Spring's relaxed
# binding, e.g. HILITE_DB_PATH, HILITE_TIME_ZONE, HILITE_ADMIN_MAX_ATTEMPTS, HILITE_ADMIN_LOCKOUT.

spring.application.name=hilite-parking
server.port=${PORT:8080}
server.shutdown=graceful

# SQLite file. Relative paths resolve against the working directory. In Docker this is
# /data/hilite-parking.db on a mounted volume (see Dockerfile).
hilite.db-path=data/hilite-parking.db
# The mall's local zone: used for displayed times and the hourly entry statistics.
hilite.time-zone=Asia/Kolkata
# Wrong admin PINs allowed per browser session before a temporary lock-out.
hilite.admin-max-attempts=5
hilite.admin-lockout=30s

# Health check for deployment platforms: GET /actuator/health -> {"status":"UP"}.
# Only the health endpoint is exposed, and without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

vaadin.launch-browser=false
# Kiosk views only need the server for user actions and a slow clock tick.
vaadin.heartbeat-interval=60
